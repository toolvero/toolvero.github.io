<script src="common.js"></script>
<script>
async function hashIt(){
 const data=new TextEncoder().encode(document.getElementById('txt').value);
 const buf=await crypto.subtle.digest('SHA-256',data);
 document.getElementById('out').textContent=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
</script>
