<script src="common.js"></script>
<script>
function now(){const d=new Date();document.getElementById('ts').value=Math.floor(d.getTime()/1000);document.getElementById('dt').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);fromTs()}
function fromTs(){const v=Number(document.getElementById('ts').value);const d=new Date(v*1000);document.getElementById('out').innerHTML=`<strong>Local:</strong> ${d.toLocaleString()}<br><strong>UTC:</strong> ${d.toUTCString()}`}
function toTs(){const d=new Date(document.getElementById('dt').value);document.getElementById('out').innerHTML=`<strong>Unix:</strong> ${Math.floor(d.getTime()/1000)}<br><strong>Milisegundos:</strong> ${d.getTime()}`}
now();
</script>
